<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="184" height="184" rx="42" fill="url(#grad-bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Memory hierarchy tiers visualization -->
  <!-- Top tier: Working Memory buffer -->
  <rect x="52" y="44" width="96" height="20" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="68" cy="54" r="3.5" fill="#38bdf8" />
  <circle cx="82" cy="54" r="3.5" fill="#38bdf8" />
  <circle cx="96" cy="54" r="3.5" fill="#38bdf8" />
  <circle cx="110" cy="54" r="3.5" fill="#38bdf8" />
  <circle cx="132" cy="54" r="4" fill="#38bdf8" filter="url(#glow)" />

  <!-- Middle tier: Episodic stream timeline -->
  <path d="M 52 88 L 148 88" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="68" cy="88" r="5" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
  <circle cx="100" cy="88" r="7" fill="#818cf8" filter="url(#glow)" />
  <circle cx="132" cy="88" r="5" fill="#0f172a" stroke="#818cf8" stroke-width="2" />

  <!-- Connecting synapses -->
  <path d="M 68 59 L 68 83" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <path d="M 132 59 L 132 83" stroke="#818cf8" stroke-width="1.5" opacity="0.6" />
  <path d="M 100 95 L 72 136" stroke="#818cf8" stroke-width="1.5" opacity="0.7" />
  <path d="M 100 95 L 128 136" stroke="#c084fc" stroke-width="1.5" opacity="0.7" />
  <path d="M 100 95 L 100 152" stroke="url(#grad-accent)" stroke-width="2" filter="url(#glow)" />

  <!-- Bottom tier: Knowledge Graph cluster -->
  <line x1="72" y1="140" x2="128" y2="140" stroke="#475569" stroke-width="1.5" />
  <line x1="72" y1="140" x2="100" y2="156" stroke="#475569" stroke-width="1.5" />
  <line x1="128" y1="140" x2="100" y2="156" stroke="#475569" stroke-width="1.5" />

  <circle cx="72" cy="140" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="72" cy="140" r="3" fill="#38bdf8" />

  <circle cx="128" cy="140" r="8" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
  <circle cx="128" cy="140" r="3" fill="#c084fc" />

  <circle cx="100" cy="156" r="10" fill="url(#grad-accent)" filter="url(#glow)" />
  <circle cx="100" cy="156" r="4" fill="#ffffff" />
</svg>
